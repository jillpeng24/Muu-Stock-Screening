name: 每日選股

on:
  # 由 Google Apps Script 每個交易日約 16:30 觸發（GitHub 免費排程常延遲，所以不用）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只預覽 LINE 訊息、不發送（1 = 預覽）'
        default: '1'
      force:
        description: '今天已經跑過也重跑（1 = 重跑）'
        default: '0'

concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行每日選股
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: python -u run_daily.py

      - name: 存檔回 GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A data/ docs/
          git commit -m "每日選股 $(TZ=Asia/Taipei date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main || true
          git push
